<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SAMHIN — Your Nairobi Plant Haven. Potted plants and flowering houseplants, hand-potted in Nairobi and delivered across Kenya."
    />
    <title>SAMHIN — Your Nairobi Plant Haven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/logo.png" />
  </head>
  <body>
    <script>
      /* Paint the right theme before the app mounts, so there is no flash. */
      try {
        var stored = localStorage.getItem('hinga.theme');
        var systemDark = !stored || stored === 'system';
        if (stored === 'dark' || (systemDark && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (error) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
