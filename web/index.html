<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hinga — potted plants and flowering houseplants, hand-potted in Nairobi and delivered across Kenya."
    />
    <title>Hinga — Potted plants & flowers, Nairobi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2322392f'/%3E%3Cg fill='none' stroke='%23fcf8f1' stroke-width='2.4'%3E%3Cellipse cx='32' cy='17' rx='8' ry='11'/%3E%3Cellipse cx='32' cy='17' rx='8' ry='11' transform='rotate(72 32 32)'/%3E%3Cellipse cx='32' cy='17' rx='8' ry='11' transform='rotate(144 32 32)'/%3E%3Cellipse cx='32' cy='17' rx='8' ry='11' transform='rotate(216 32 32)'/%3E%3Cellipse cx='32' cy='17' rx='8' ry='11' transform='rotate(288 32 32)'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='4' fill='%239f4f5b'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <script>
      /* Paint the right theme before the app mounts, so there is no flash. */
      try {
        var stored = localStorage.getItem('hinga.theme');
        var systemDark = !stored || stored === 'system';
        if (stored === 'dark' || (systemDark && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (error) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
